name: Data multiplayer branch smoke

on:
  push:
    branches: [multiplayer-data-v0120, qol-v0120, qol-v0120-hudflow, character-rating-v0123]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check data sync and QoL
        run: |
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/net-v0120-data.js
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0120-qol.js
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0120-qol-fix.js
          if [ -f Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0123.js ]; then node --check Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0123.js; fi
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/app.js
          node --check .github/scripts/data-smoke.mjs
          node --check .github/scripts/data-match-test.mjs
          node --check .github/scripts/qol-smoke.mjs
          node --check .github/scripts/qol-rematch-test.mjs
          node --check .github/scripts/hud-flow-smoke.mjs
          if [ -f .github/scripts/character-rating-smoke.mjs ]; then node --check .github/scripts/character-rating-smoke.mjs; fi
      - name: Install browser test helper
        run: npm install --no-save puppeteer-core@24.27.0
      - name: Start local server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/bm-http.log 2>&1 &
          echo $! > /tmp/bm-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bm-http.log
          exit 1
      - name: Chrome boot A/B smoke
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?ci=${{ github.sha }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME_PATH" --version
          node .github/scripts/data-smoke.mjs
      - name: QoL UI smoke
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?ci=${{ github.sha }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 90s node .github/scripts/qol-smoke.mjs
      - name: HUD graphics and spectate flow smoke
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?ci=${{ github.sha }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 90s node .github/scripts/hud-flow-smoke.mjs
      - name: Character customization and rating smoke
        if: ${{ hashFiles('.github/scripts/character-rating-smoke.mjs') != '' }}
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?ci=${{ github.sha }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 90s node .github/scripts/character-rating-smoke.mjs
      - name: Two-client data match integration
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?ci=${{ github.sha }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 120s node .github/scripts/data-match-test.mjs
      - name: Two-client rematch integration
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?ci=${{ github.sha }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 120s node .github/scripts/qol-rematch-test.mjs