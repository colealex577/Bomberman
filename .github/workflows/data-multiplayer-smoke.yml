name: Data multiplayer branch smoke
on:
  push:
    branches: [fix/multiplayer-reliability-kick, v0151-matchmaking-ai-polish, ai-overhaul-v0150, sim-opening-breakout-v0144, ai-intelligence-social-v0143, ai-controller-route-commitment, authoritative-multiplayer-v0129, multiplayer-data-v0120, qol-v0120, qol-v0120-hudflow, character-rating-v0123, multiplayer-v0124, multiplayer-v0125, ai-bomb-attack-v0126, rematch-settings-v0127, leaderboard-ranks-v0128, gameplay-social-v0130, matchmaking-polish-v0131, gameplay-whole-v0132, map-selection-v0133, gameplay-ai-chat-v0134, ai-polish-v0135, ai-challenge-v0136, stability-chat-v0137, ai-movement-social-v0138, ai-matchmaking-social-v0139, ai-social-stability-v0140, ai-chat-openhunt-v0141]
  workflow_dispatch:
concurrency:
  group: data-multiplayer-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check multiplayer reliability files
        run: |
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/net-v0115-core.js
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/net-v0115-match.js
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0125-connect.js
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/multiplayer-v0129.js
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v016218-round-integrity-rematch.js
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/app.js
          node --check Bomberman-Ultimate-Universal-Web-v0.10/sw.js
          node --check .github/scripts/multiplayer-kick-reconnect-smoke.mjs
          node --check .github/scripts/authoritative-network-test.mjs
  regression:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test: [multiplayer-kick-reconnect-smoke, authoritative-network-test, ai-controller-browser, ai-controller-regression, data-smoke, profile-sync-smoke, v150-ai-overhaul-smoke, v151-matchmaking-ai-polish-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test helper
        run: npm install --no-save puppeteer-core@24.27.0
      - name: Run browser regression
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?netdebug=1
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/bm-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$TEST_URL" >/dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 210s node .github/scripts/${{ matrix.test }}.mjs
