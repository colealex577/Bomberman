name: Data multiplayer branch smoke
on:
  push:
    branches: [authoritative-multiplayer-v0129, multiplayer-data-v0120, qol-v0120, qol-v0120-hudflow, character-rating-v0123, multiplayer-v0124, multiplayer-v0125, ai-bomb-attack-v0126, rematch-settings-v0127, leaderboard-ranks-v0128, gameplay-social-v0130, matchmaking-polish-v0131, gameplay-whole-v0132, map-selection-v0133, gameplay-ai-chat-v0134, ai-polish-v0135, ai-challenge-v0136]
  workflow_dispatch:
concurrency:
  group: data-multiplayer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        test: [data-smoke, qol-smoke, hud-flow-smoke, character-rating-smoke, profile-sync-smoke, data-match-test, qol-rematch-test, v124-multiplayer-smoke, v125-netcode-smoke, v126-ai-smoke, v127-rematch-settings-smoke, v128-leaderboard-smoke, authoritative-network-test, v130-social-smoke, v131-polish-smoke, v132-whole-smoke, v133-maps-smoke, v134-gameplay-smoke, v135-polish-smoke, v136-challenge-smoke]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: find Bomberman-Ultimate-Universal-Web-v0.10/files .github/scripts -name '*.js' -o -name '*.mjs' | xargs -n 1 node --check
      - name: Install browser test helper
        run: npm install --no-save puppeteer-core@24.27.0
      - name: Run browser regression
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?netdebug=1
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/bm-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$TEST_URL" >/dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 210s node .github/scripts/${{ matrix.test }}.mjs
