name: Apply v0.14.1 chat compatibility fix
on:
  push:
    branches:
      - ai-chat-openhunt-v0141
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix and syntax check
        run: |
          python3 .github/scripts/v141-fix-throttle.py
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0140-stability-social.js
          node --check .github/scripts/v141-ai-chat-smoke.mjs
      - name: Commit fixed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0140-stability-social.js .github/scripts/v141-ai-chat-smoke.mjs
          git commit -m "Scope v0.14.1 chat throttling to autonomous dialogue"
          git push
