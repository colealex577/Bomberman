name: Bomberman live smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Pinpoint Bomberman startup lock by runtime layer
        shell: bash
        run: |
          set -e
          BASE="https://colealex577.github.io/Bomberman/Bomberman-Ultimate-Universal-Web-v0.10/index.html?ci=${GITHUB_SHA}"
          LIVE=0
          for i in $(seq 1 60); do
            if curl -Ls --max-time 10 "$BASE" | grep -q "app.js?v=0126"; then
              echo "v0.12.6 is live"
              LIVE=1
              break
            fi
            sleep 2
          done
          if [ "$LIVE" != "1" ]; then echo "v0.12.6 did not deploy"; exit 1; fi
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          : > /tmp/cdp-smoke.log
          for MODE in base 118 119 120 120end 121 122 122menu; do
            echo "===== DIAG $MODE =====" | tee -a /tmp/cdp-smoke.log
            export TEST_URL="$BASE&diag=$MODE"
            node .github/scripts/live-smoke.mjs | tee -a /tmp/cdp-smoke.log
            sleep 1
          done
          echo "===== SUMMARY =====" | tee -a /tmp/cdp-smoke.log
          grep -E "===== DIAG|MILESTONE: inspect-returned|SMOKE_ERROR:|STATE:" /tmp/cdp-smoke.log | tee -a /tmp/cdp-smoke.log.summary || true
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bomberman-cdp-smoke
          path: |
            /tmp/cdp-smoke.log
            /tmp/cdp-smoke.log.summary
          if-no-files-found: ignore
