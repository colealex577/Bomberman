name: Bomberman live smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed Bomberman with Chrome DevTools
        shell: bash
        run: |
          set -e
          URL="https://colealex577.github.io/Bomberman/Bomberman-Ultimate-Universal-Web-v0.10/index.html?ci=${GITHUB_SHA}"
          for i in $(seq 1 45); do
            if curl -Ls --max-time 10 "$URL" | grep -q "app.js?v=0124"; then
              echo "v0.12.4 is live"
              break
            fi
            sleep 2
          done
          export TEST_URL="$URL"
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node .github/scripts/live-smoke.mjs | tee /tmp/cdp-smoke.log
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bomberman-cdp-smoke
          path: /tmp/cdp-smoke.log
          if-no-files-found: ignore
