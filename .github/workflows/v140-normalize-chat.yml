name: Normalize v0.14 chat dedupe
on:
  push:
    branches: [ai-social-stability-v0140]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace raw-input dedupe with rendered-line dedupe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0140-stability-social.js')
          s=p.read_text()
          old="""function wrapChat(owner,keyName){if(!owner||typeof owner[keyName]!=='function'||owner[keyName].__v140Dedupe)return;var old=owner[keyName];function wrapped(name,text,local){if(chatGuardDepth)return old.apply(this,arguments);if(isSimRemote(name,local)){var k=normLine(text);if(k&&social.used[k])return false;if(k)markUsed(text)}chatGuardDepth++;try{return old.apply(this,arguments)}finally{chatGuardDepth--}}wrapped.__v140Dedupe=true;wrapped.__v140Old=old;owner[keyName]=wrapped}"""
          new="""function wrapChat(owner,keyName){if(!owner||typeof owner[keyName]!=='function'||owner[keyName].__v140Dedupe)return;var old=owner[keyName];function wrapped(name,text,local){if(chatGuardDepth)return old.apply(this,arguments);var remote=isSimRemote(name,local),root=S.els&&S.els.chatMessages,before=root?Array.prototype.slice.call(root.children):[],r;chatGuardDepth++;try{r=old.apply(this,arguments)}finally{chatGuardDepth--}if(remote&&root){var after=Array.prototype.slice.call(root.children),added=after.filter(function(n){return before.indexOf(n)<0});for(var i=0;i<added.length;i++){var row=added[i],strong=row.querySelector&&row.querySelector('strong'),span=row.querySelector&&row.querySelector('span');if(!span||strong&&clean(strong.textContent)!==clean(S.remoteName))continue;var finalText=span.textContent||'',k=normLine(finalText);if(k&&social.used[k]){row.remove();continue}if(k)markUsed(finalText)}}else if(remote){var k=normLine(text);if(k&&social.used[k])return false;if(k)markUsed(text)}return r}wrapped.__v140Dedupe=true;wrapped.__v140Old=old;owner[keyName]=wrapped}"""
          if old not in s:
              raise SystemExit('expected wrapChat implementation not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/v140-normalize-chat.yml').unlink()
          PY
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0140-stability-social.js
      - name: Commit normalized source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Normalize v0.14 rendered chat dedupe"
          git push origin HEAD:ai-social-stability-v0140
