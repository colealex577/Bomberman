name: v0.15.4.x observer/chat release gate
on:
  push:
    branches: [v0154-observer-chat-controls, v01541-mobile-chat-queue-ui, v01542-mobile-chat-row-fix, v01543-expanded-roster-banter, v01544-chat-mode-fixes, v0155-dialogue-observer-population, v0156-observer-gameplay-polish, v01561-first-run-version-cleanup, v0157-ai-chat-death-flow]
  workflow_dispatch:
concurrency:
  group: v154-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        test: [v125-netcode-smoke, authoritative-network-test, v1541-progression-compat-smoke, v1541-mobile-chat-smoke, v1543-dialogue-smoke, v1544-chat-mode-smoke, v155-social-population-smoke, v156-gameplay-polish-smoke, v1561-onboarding-brand-smoke, v1562-public-chat-stability-smoke, v157-ai-chat-death-flow-smoke, v157-public-chat-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: find Bomberman-Ultimate-Universal-Web-v0.10/files .github/scripts \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Install browser test helper
        run: npm install --no-save puppeteer-core@24.27.0
      - name: Run browser regression
        env:
          TEST_URL: http://127.0.0.1:8080/Bomberman-Ultimate-Universal-Web-v0.10/index.html?netdebug=1
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/bm-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$TEST_URL" >/dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 210s node .github/scripts/${{ matrix.test }}.mjs
