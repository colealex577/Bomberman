name: Apply v0.14.1 tuning
on:
  push:
    branches:
      - ai-chat-openhunt-v0141
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and syntax-check patch
        run: |
          python3 .github/scripts/v141-apply.py
          git checkout HEAD -- .github/workflows/data-multiplayer-smoke.yml
          node --check Bomberman-Ultimate-Universal-Web-v0.10/files/runtime-v0140-stability-social.js
          node --check .github/scripts/v141-ai-chat-smoke.mjs
      - name: Commit patched source
        run: |
          rm .github/scripts/v141-apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune v0.14.1 bot pursuit, corridor exits, and chat frequency"
          git push
