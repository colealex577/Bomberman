    <style id="ios-v0111-hotfix">
    @media (hover: none), (pointer: coarse) {
      body:not(.desktop-ui) .mobile_controls {
        position: fixed; z-index: 3000;
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        display: flex !important; align-items: flex-end; justify-content: space-between;
        pointer-events: none; touch-action: none;
      }
      body:not(.desktop-ui) .mobile_joystick,
      body:not(.desktop-ui) .mobile_action_cluster,

<body>
    <div class="container">
        <div class="game_toolbar">
            <button id="ultimateModeBtn" class="ultimate_mode_btn" type="button" aria-pressed="false">ULTIMATE MODE: OFF</button>
            <span id="ultimateModeHint" class="ultimate_mode_hint">100% block drops • power-ups 5× stronger</span>
            <div id="onlineMatchBar" class="online_match_bar" hidden>
                <span id="onlineMatchStatus">ONLINE</span>
                <button id="onlineDisconnectBtn" type="button">Disconnect</button>
            </div>
        </div>

        <div id="localStage">
            <div id="game">
                <canvas id="canvas" width="545" height="416"></canvas>
                <div id="spectatorBanner" class="spectator_banner" hidden>
                    <strong id="spectatorTitle">GAME OVER</strong>
                    <span id="spectatorSubtitle">SPECTATING AI MATCH</span>
                </div>
            </div>
            <div class="control_panel">
                <div class="wrapper">
                    <div class="panel">
                        <div class="panel_header"><p class="panel_header_title" id="player1"></p></div>
                        <div class="control_element_movement">
                            <div class="control_element_ico"><img src="./files/img/i-control-01.svg" class="i_control01"></div>
                            <div class="control_element_desc"><p class="control_element_title" id="movement1"></p></div>
                        </div>
                        <div class="control_element_bomb">
                            <div class="control_element_ico"><img src="./files/img/i-control-02.svg" class="i_control02"></div>
                            <div class="control_element_desc"><p class="control_element_title" id="bomb1"></p></div>
                        </div>
                    </div>
                    <div class="panel">
                        <div class="panel_header"><p class="panel_header_title" id="player2"></p></div>
                        <div class="control_element_movement">
                            <div class="control_element_ico"><img src="./files/img/i-control-03.svg" class="i_control03"></div>
                            <div class="control_element_desc"><p class="control_element_title" id="movement2"></p></div>
                        </div>
                        <div class="control_element_bomb">
                            <div class="control_element_ico"><img src="./files/img/i-control-04.svg" class="i_control04"></div>
                            <div class="control_element_desc"><p class="control_element_title" id="bomb2"></p></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="remoteStage" class="remote_stage" hidden>
            <video id="remoteVideo" playsinline autoplay muted></video>
            <div class="remote_stage_note">REMOTE MATCH VIEW</div>
        </div>
    </div>

    <div class="mobile_controls" aria-label="Touch controls">
        <div class="mobile_joystick">
            <button class="touch_btn touch_up" data-action="up" aria-label="Move up">▲</button>
            <div class="mobile_middle_row">
                <button class="touch_btn touch_left" data-action="left" aria-label="Move left">◀</button>
                <button class="touch_btn touch_down" data-action="down" aria-label="Move down">▼</button>
                <button class="touch_btn touch_right" data-action="right" aria-label="Move right">▶</button>
            </div>
        </div>
        <div class="mobile_action_cluster">
            <button class="touch_small" data-action="mute" aria-label="Mute">M</button>
            <button class="touch_btn touch_bomb" data-action="bomb" aria-label="Bomb">●</button>
        </div>
    </div>
